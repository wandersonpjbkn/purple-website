name = "purple-mail"
main = "src/index.ts"
compatibility_date = "2026-07-06"
compatibility_flags = ["nodejs_compat"]

# Custom domain the front-end points to (VITE_CONTACT_API_URL).
# Requires purplecomunicacao.com.br to already be on this Cloudflare account.
routes = [{ pattern = "mail.purplecomunicacao.com.br", custom_domain = true }]

# Non-secret config, safe to commit.
[vars]
ALLOWED_ORIGIN = "https://purplecomunicacao.com.br"
ALLOWED_ORIGIN_WWW = "https://www.purplecomunicacao.com.br"
