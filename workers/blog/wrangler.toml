name = "purple-blog"
main = "src/index.ts"
compatibility_date = "2026-07-07"

# Custom domain the front-end points to (VITE_POSTS_API_URL).
# Requires purplecomunicacao.com.br to already be on this Cloudflare account.
routes = [{ pattern = "blog.purplecomunicacao.com.br", custom_domain = true }]

# Non-secret config, safe to commit.
[vars]
ALLOWED_ORIGIN = "https://purplecomunicacao.com.br"
ALLOWED_ORIGIN_WWW = "https://www.purplecomunicacao.com.br"

# Native wrapper with R2 Bucket
[[r2_buckets]]
binding = "POSTS_BUCKET"
bucket_name = "purple-comunica"

# Secrets are NOT set here (this file is committed to git). Set them once via:
#   yarn wrangler secret put RENDER_DEPLOY_HOOK

