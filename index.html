<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Base -->
    <title>Purple Comunicação</title>
    <meta
      name="description"
      content="Employer Branding, Endomarketing e Comunicação Interna com foco em pessoas e resultados."
    />
    <meta name="theme-color" content="#8b2fcc" />

    <!-- Open Graph base -->
    <meta property="og:site_name" content="Purple Comunicação" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="/og-default.jpg" />

    <!-- Google Fonts (preconnect para performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- EmailJS (sem npm install, carregado via CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
    <script>
      window.addEventListener('load', function () {
        if (window.emailjs) {
          window.emailjs.init({ publicKey: 'SUA_PUBLIC_KEY' })
        }
      })
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
